name: pipeline

on:
  push

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

        name: Defense & Hardened Security Pipeline

# ------------------------------------------------------------------------------
# CONTROLE DE GATILHOS (TRIGGERS)
# ------------------------------------------------------------------------------
on:
  # O pipeline NÃO executa via push direto na main se o ambiente estiver correto,
  # mas se alguém tentar forçar um push, o job 'prevent-direct-push' irá falhar imediatamente.
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened, ready_for_review]

# Concorrência: Cancela execuções anteriores da mesma branch em novos commits,
# impedindo ataques de negação de serviço (DoS) por excesso de builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# PERMISSÕES MÍNIMAS (Princípio do Menor Privilégio)
# Por padrão, revoga TODAS as permissões do repositório neste workflow.
# ------------------------------------------------------------------------------
permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: BLOQUEIO E VALIDAÇÃO DE REGRA DE BRANCH
  # ============================================================================
  prevent-direct-push:
    name: 🛡️ Validação de Push e Estritura de Branch
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear Push Direto na Main/Master
        if: github.event_name == 'push'
        run: |
          echo "❌ [ERRO DE SEGURANÇA]: Push direto na branch principal (${{ github.ref_name }}) é estritamente PROIBIDO!"
          echo "👉 Toda alteração DEVE vir de uma nova branch via Pull Request (PR)."
          exit 1

      - name: Validar Origem do Pull Request
        if: github.event_name == 'pull_request'
        run: |
          HEAD_REF="${{ github.head_ref }}"
          echo "Verificando branch de origem: $HEAD_REF"
          
          if [ "$HEAD_REF" == "main" ] || [ "$HEAD_REF" == "master" ]; then
            echo "❌ [ERRO]: Você não pode abrir um PR partindo diretamente da branch principal!"
            exit 1
          fi
          echo "✅ Origem de branch validada com sucesso."

  # ============================================================================
  # JOB 2: AUDITORIA DE SEGURANÇA E SEGREDOS VAZADOS
  # ============================================================================
  security-audit:
    name: 🔍 Auditoria de Código e Credenciais Expostas
    runs-on: ubuntu-latest
    needs: prevent-direct-push
    steps:
      - name: Checkout seguro do repositório
        uses: actions/checkout@v4
        with:
          # Baixa o histórico completo para permitir verificação do Git
          fetch-depth: 0

      # Garante que nenhum Token, Senha ou Chave privada foi comitada por engano
      - name: Varredura de Segredos (TruffleHog)
        uses: trufflesecurity/trufflehog-actions-scan@v3.82.6
        with:
          extra_args: --debug --only-verified

      # Verifica se arquivos sensíveis da infraestrutura foram alterados no PR
      - name: Proteger Arquivos Críticos de Infraestrutura
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Arquivos modificados no PR:"
          echo "$CHANGED_FILES"
          
          # Bloqueia alteração nos workflows por colaboradores sem revisão explícita
          if echo "$CHANGED_FILES" | grep -E '^\.github/workflows/'; then
            echo "⚠️ [ALERTA DE SEGURANÇA]: Este PR tenta modificar arquivos de pipeline (.github/workflows/)!"
          fi

  # ============================================================================
  # JOB 3: VALIDAÇÃO DE QUALIDADE E BUILD DA APLICAÇÃO
  # ============================================================================
  build-and-verify:
    name: ⚙️ Build Seguro e Testes
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Ajuste os passos abaixo de acordo com a sua linguagem/tecnologia
      - name: Exemplo de Validação do Código
        run: |
          echo "✅ Código validado com sucesso. Todos os testes de segurança passaram."